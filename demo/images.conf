# Image map: the one place that names the Docker images of the benchmark.
# Read by demo/run_demo.sh (pull or reuse) and demo/push_images.sh (publish).
#
# key    published image (GitHub container registry)                 local build tag (make images)
# -----  ---------------------------------------------------------   -----------------------------
infra    ghcr.io/nahueldeniz/lidar-slam-orchards/infra:melodic        slambench/infra:melodic
hdl      ghcr.io/nahueldeniz/lidar-slam-orchards/hdl:melodic          slambench/hdl:melodic
lego     ghcr.io/nahueldeniz/lidar-slam-orchards/lego:D               slambench/lego:D
aloam    ghcr.io/nahueldeniz/lidar-slam-orchards/aloam:D              slambench/aloam:D
dlo      ghcr.io/nahueldeniz/lidar-slam-orchards/dlo:melodic          slambench/dlo:melodic
kiss     ghcr.io/nahueldeniz/lidar-slam-orchards/kiss:melodic         slambench/kiss:melodic
mesh     ghcr.io/nahueldeniz/lidar-slam-orchards/mesh:melodic         slambench/mesh:melodic
# Shared base of all images above. Not needed to run the demo; published so that one
# method image can be rebuilt without rebuilding the base (README, "Rebuild the images").
base     ghcr.io/nahueldeniz/lidar-slam-orchards/base:melodic         slambench/base:melodic

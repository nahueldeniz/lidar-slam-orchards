  pl_1:
    dataset: pullally
    folder: DS_P1_20230806
    role: test
    lidar_topic: /velodyne_points
    # Pauses > 30 s in which no message was recorded are skipped during playback: the robot
    # stood still across every one of them (ground-truth jump <= 2 cm), so the methods see the
    # same motion; saves ~46 min per run. Short gaps (2-5 s, robot moving) are played normally.
    play_skip_empty_s: 30
    bags:   # chronological order (file name = recording start time, local time)
      - "pullally/DS_P1_20230806/2023-08-06-10-47-21_0.bag"
      - "pullally/DS_P1_20230806/2023-08-06-10-50-33_1.bag"

      - "pullally/DS_P1_20230806/2023-08-06-12-21-17_2.bag"
    gt_bag: pullally/ground_truth/run1/gt.bag   # copy of DS_P1_20230806/GT/gt.bag
    gt_topic: /fix                # NavSatFix, 2 Hz; /vo in the same bag is the same fix in UTM
    gt_type: navsatfix            # converted to local ENU (pymap3d), origin at the first fix

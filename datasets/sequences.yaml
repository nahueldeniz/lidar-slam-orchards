    sensor:
      sensor_height: 0.5317        # C4 (Nahuel)
      tilt_deg: 0                  # RANSAC ground-plane tilt 2.7 deg (terrain + gait), treated as for CitrusFarm
      # RANSAC height 0.460 m (datasets/lidar_height_pl_1.json) vs 0.5317 m (C4, kept): see REPORT.md
      lidar_frame_id: velodyne     # header.frame_id of the LiDAR messages (checked on the first scan)
      scan_period: 0.25            # 4 Hz (bag index); LOAM-family builds keep 0.1 s (REPORT.md)


# Sequence registry (brief Section 4). Bag paths are relative to the data root.
#
# Data root (where the LiDAR bags are), in order of precedence:
#   1. the environment variable SLAMBENCH_DATA, e.g. SLAMBENCH_DATA=/mnt/bags
#   2. data_root below (null = not set)
#   3. default: this folder (datasets/)
# gt_bag paths are always relative to datasets/.
# The bag paths below follow the layout written by datasets/download_citrusfarm.sh
# (<data root>/citrusfarm/raw/<folder>/base_*.bag) and, for Pullally run 1,
# <data root>/pullally/DS_P1_20230806/<file>.bag (see README.md, "Datasets").
# Public-release note: the measured runs read the same files from a different local
# folder layout on the authors' drive (as recorded in each run's manifest.json,
# play_command); the CitrusFarm files were checked against the
# official MD5 sums (datasets/local_copies_md5.json).
data_root: null

sequences:
  cf_2:
    dataset: citrusfarm
    folder: 02_13B_Jackal
    role: test
    lidar_topic: /velodyne_points
    bags:   # chronological order (file name = recording start time)
      - "citrusfarm/raw/02_13B_Jackal/base_2023-07-18-14-51-21_0.bag"
    gt_bag: citrusfarm/ground_truth/02_13B_Jackal/gt.bag
    gt_topic: /gps/fix/odometry
    gt_nominal_period_s: 0.1
    lever_arm_lidar_to_antenna_m: [-0.220, 0.000, 0.153]   # 04-lidar-gps-result.txt (CAD)
    lidar_forward_axis: [1, 0, 0]   # LiDAR x = robot forward (identity base_link->LiDAR rotation)
    sensor:
      sensor_height: 0.43          # hdl floor detection (Q7): median of the RANSAC estimates 0.418-0.440 m (datasets/lidar_height_cf_*.json), 1.2 cm below the calibration route (0.442 m)
      tilt_deg: 0                  # hdl floor detection: LiDAR pitch; identity rotation base_link->LiDAR (05-baselink-lidar-result.txt)
      lidar_frame_id: velodyne     # header.frame_id of the LiDAR messages (checked on the first scan), for hdl
      scan_period: 0.1             # to be confirmed from the inventory

